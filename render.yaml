services:
  - type: web
    name: cirp-compliance-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_PATH
        value: /tmp/tracker.db
