services:
  - type: web
    name: cirp-compliance-command-centre
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: TZ
        value: Asia/Kolkata
      - key: REMINDER_LEAD_DAYS
        value: "3"
      - key: DATABASE_PATH
        value: /var/data/tracker.db
    disk:
      name: cirp-data
      mountPath: /var/data
      sizeGB: 1
